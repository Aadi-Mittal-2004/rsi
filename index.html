            "@type": "Answer",
            "text": "Quartzite is the hardest (Mohs 7-8) with the lowest water absorption (under 1%), ideal for exterior cladding and harsh climates. Sandstone (Mohs 6-7) offers the widest color range and best value for patios and paving. Limestone (Mohs 3-4) provides the most refined, consistent appearance for interior applications. Roop Stone Impex supplies all three types with expert guidance on selection."
